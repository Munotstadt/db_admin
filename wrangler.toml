name = "db-admin"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "db_admin"
database_id = "78377bf1-f491-4879-bab0-d47a08605f77"

[triggers]
# Ziel: 18:05 und 02:00 Zürich-Zeit. Cron kennt nur UTC -> beide UTC-Varianten (CEST/CET);
# scheduled() in src/worker.js filtert auf die passende Zürcher Uhrzeit.
crons = ["5 16,17 * * *", "0 0,1 * * *"]

[observability]
enabled = true

# Folgende Secrets im Cloudflare Dashboard setzen (Worker "db-admin" ->
# Settings -> Variables and Secrets), NICHT hier im Repo:
#   COLLECTOR_KEY   (für manuelle POST-Aufrufe: /api/usage/cloudflare, /api/collector/run)
#   CF_API_TOKEN    (Account Analytics: Read + D1: Read, optional Zone Analytics: Read)
#   CF_ACCOUNT_ID
#   CF_ZONE_ID      (optional)
