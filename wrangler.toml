name = "db-admin"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "db_admin"
database_id = "78377bf1-f491-4879-bab0-d47a08605f77"

# COLLECTOR_KEY wird NICHT hier eingetragen (kein Secret im Repo!), sondern im
# Cloudflare Dashboard: Worker "db-admin" -> Settings -> Variables and Secrets
# -> COLLECTOR_KEY hinzufügen (Typ: Secret). Denselben Wert danach als GitHub
# Actions Secret (COLLECTOR_KEY) in Munotstadt/db_admin hinterlegen.
