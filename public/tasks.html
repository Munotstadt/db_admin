<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Munotstadt DB Admin · Tasks</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#E30613; --bg:#fff; --card:#fff; --border:#d8d8d8;
    --text:#1a1a1a; --muted:#6b6b70;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif;}
  header.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:2px solid #1a1a1a;background:#fff;}
  header.topbar .brand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}
  header.topbar .brand span{color:var(--red);}
  header.topbar .nav-right{display:flex;align-items:center;gap:6px;}
  header.topbar .nav-links{display:flex;gap:2px;margin-right:6px;}
  header.topbar .nav-link,header.topbar .logout-link{text-decoration:none;color:#1a1a1a;font-size:13px;font-weight:500;padding:7px 12px;border-radius:6px;white-space:nowrap;}
  header.topbar .logout-link{color:#666;}
  header.topbar .nav-link:hover,header.topbar .logout-link:hover{background:#f4f4f4;}
  header.topbar .nav-link.active{background:#1a1a1a;color:#fff;}
  main{padding:1.5rem;max-width:1100px;margin:0 auto;}
  .toolbar{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center;}
  .toolbar select,.toolbar input{padding:.5rem .7rem;border:1px solid var(--border);border-radius:6px;font-family:inherit;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:1rem 1.2rem;margin-bottom:.7rem;}
  .card .row1{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;}
  .card h3{margin:0;font-size:1rem;font-family:'Space Grotesk',sans-serif;}
  .meta{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--muted);}
  .note{margin:.5rem 0 0;font-size:.9rem;color:#333;white-space:pre-wrap;}
  .badge{display:inline-block;padding:.15rem .5rem;border-radius:20px;font-size:.7rem;font-family:'IBM Plex Mono',monospace;}
  .badge.open{background:#fde8e8;color:var(--red);}
  .badge.in_progress{background:#fff3cd;color:#8a6d00;}
  .badge.done{background:#e5f6e8;color:#1e7a34;text-decoration:line-through;}
  .actions{display:flex;gap:.4rem;margin-top:.6rem;}
  .actions button{font-size:.78rem;padding:.3rem .6rem;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;}
  .actions button:hover{border-color:var(--red);color:var(--red);}
  .badge.target{background:#eef1f6;color:#1a1a1a;text-transform:none;}
  .badge.target b{color:var(--red);font-weight:500;margin-right:.25rem;}
  .seg{display:flex;gap:.4rem;}
  .seg label{flex:1;display:flex;align-items:center;justify-content:center;gap:.35rem;padding:.45rem;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-size:.85rem;margin:0;color:#1a1a1a;}
  .seg input{margin:0;}
  .seg label:has(input:checked){border-color:var(--red);color:var(--red);}
  #status{font-size:.85rem;color:var(--muted);margin-bottom:1rem;}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Munotstadt <span>DB Admin</span></div>
    <div class="nav-right">
      <div class="nav-links">
        <a href="index.html" class="nav-link">Cloudflare</a>
        <a href="ram.html" class="nav-link">NAS RAM</a>
      <a href="tasks.html" class="nav-link active">Tasks</a>
      </div>
      <a href="/cdn-cgi/access/logout" class="logout-link">Logout</a>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <select id="filterStatus">
        <option value="">Alle Status</option>
        <option value="open" selected>Offen</option>
        <option value="in_progress">In Arbeit</option>
        <option value="done">Erledigt</option>
      </select>
      <select id="filterType" title="Bezug">
        <option value="">App &amp; DB</option>
        <option value="app">Nur Apps</option>
        <option value="db">Nur DBs</option>
      </select>
      <select id="filterTarget" title="App / DB">
        <option value="">Alle Apps/DBs</option>
      </select>
      <input id="filterText" placeholder="Suchen (Titel, Notiz, Quelle)…" style="flex:1;min-width:150px;">
      <button id="refreshBtn" style="padding:.5rem 1rem;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;">↻ Aktualisieren</button>
      <button id="newTaskBtn" style="padding:.5rem 1rem;border-radius:6px;border:1px solid var(--red);background:var(--red);color:#fff;cursor:pointer;">+ Neuer Task</button>
    </div>

    <div id="taskOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9999;align-items:center;justify-content:center;">
      <div style="background:#fff;border-radius:10px;padding:1.4rem;width:min(420px,90vw);">
        <h3 id="nt-heading" style="margin:0 0 .8rem;font-family:'Space Grotesk',sans-serif;">Neuer Task</h3>
        <label style="display:block;font-size:.8rem;color:#555;margin:.6rem 0 .2rem;">Betrifft</label>
        <div class="seg">
          <label><input type="radio" name="nt-type" value="app" checked> App</label>
          <label><input type="radio" name="nt-type" value="db"> DB</label>
        </div>
        <label id="nt-target-label" style="display:block;font-size:.8rem;color:#555;margin:.6rem 0 .2rem;">App</label>
        <input id="nt-target" list="nt-target-list" autocomplete="off" placeholder="z.B. energy" style="width:100%;padding:.5rem;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;">
        <datalist id="nt-target-list"></datalist>
        <label style="display:block;font-size:.8rem;color:#555;margin:.6rem 0 .2rem;">Titel</label>
        <input id="nt-title" placeholder="Kurze Zusammenfassung" style="width:100%;padding:.5rem;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;">
        <label style="display:block;font-size:.8rem;color:#555;margin:.6rem 0 .2rem;">Notiz</label>
        <textarea id="nt-note" style="width:100%;min-height:80px;padding:.5rem;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;"></textarea>
        <label style="display:block;font-size:.8rem;color:#555;margin:.6rem 0 .2rem;">Priorität</label>
        <select id="nt-prio" style="width:100%;padding:.5rem;border:1px solid #ddd;border-radius:6px;">
          <option value="low">Niedrig</option>
          <option value="normal" selected>Normal</option>
          <option value="high">Hoch</option>
        </select>
        <div id="nt-status" style="font-size:.8rem;margin-top:.5rem;color:#555;"></div>
        <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem;">
          <button id="nt-cancel" style="padding:.5rem 1rem;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer;">Abbrechen</button>
          <button id="nt-save" style="padding:.5rem 1rem;border-radius:6px;border:1px solid var(--red);background:var(--red);color:#fff;cursor:pointer;">Speichern</button>
        </div>
      </div>
    </div>
    <div id="status">Lade Tasks…</div>
    <div id="list"></div>
  </main>

<script>
  // Basis-URL des Cloudflare Workers (D1-API), per Access/Google geschützt
  // Same-Origin: läuft jetzt auf admin.munot.app zusammen mit dem Frontend.
  const API_BASE = "/api";

  const listEl = document.getElementById('list');
  const statusEl = document.getElementById('status');
  const filterStatus = document.getElementById('filterStatus');
  const filterType = document.getElementById('filterType');
  const filterTarget = document.getElementById('filterTarget');
  const filterText = document.getElementById('filterText');
  const TYPE_LABEL = { app: 'App', db: 'DB' };
  let targets = { apps: [], dbs: [] };

  async function loadTargets(){
    try {
      const res = await fetch(`${API_BASE}/tasks/targets`, { credentials: 'include' });
      if (res.ok) targets = await res.json();
    } catch {}
    fillFilterTarget();
  }

  function fillFilterTarget(){
    const type = filterType.value;
    const current = filterTarget.value;
    const groups = [];
    if (type !== 'db') groups.push(['app', 'Apps', targets.apps]);
    if (type !== 'app') groups.push(['db', 'DBs', targets.dbs]);
    filterTarget.innerHTML = '<option value="">' + (type === 'app' ? 'Alle Apps' : type === 'db' ? 'Alle DBs' : 'Alle Apps/DBs') + '</option>' +
      groups.map(([t, label, names]) => names.length ? `<optgroup label="${label}">` +
        names.map(n => `<option value="${t}:${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('') + '</optgroup>' : '').join('');
    filterTarget.value = [...filterTarget.options].some(o => o.value === current) ? current : '';
  }

  async function loadTasks(){
    statusEl.textContent = 'Lade Tasks…';
    try {
      const st = filterStatus.value;
      const params = new URLSearchParams();
      if (st) params.set('status', st);
      const sel = filterTarget.value;
      if (sel) {
        const i = sel.indexOf(':');
        params.set('targetType', sel.slice(0, i));
        params.set('target', sel.slice(i + 1));
      } else if (filterType.value) {
        params.set('targetType', filterType.value);
      }
      const qs = params.toString();
      const res = await fetch(`${API_BASE}/tasks${qs ? '?' + qs : ''}`, { credentials: 'include' });
      if (!res.ok) throw new Error('HTTP '+res.status);
      let tasks = await res.json();
      const q = filterText.value.trim().toLowerCase();
      if (q) tasks = tasks.filter(t => [t.Title, t.Note, t.SourceApp, t.Target].some(v => (v || '').toLowerCase().includes(q)));
      render(tasks);
      statusEl.textContent = `${tasks.length} Task(s)`;
    } catch(e) {
      statusEl.innerHTML = 'Nicht eingeloggt oder Verbindung fehlgeschlagen. ' +
        '<a href="' + API_BASE + '/tasks" target="_blank" rel="noopener">Hier einloggen</a> und danach ↻ Aktualisieren klicken.';
    }
  }

  function pageFromUrl(url){
    if (!url) return null;
    try {
      const u = new URL(url);
      let p = u.pathname.split('/').filter(Boolean).pop() || 'index.html';
      return p;
    } catch { return null; }
  }

  function formatLocal(sqlDateTime){
    // D1/SQLite liefert "YYYY-MM-DD HH:MM:SS" in UTC ohne Zeitzone-Suffix.
    // Explizit als UTC parsen, dann in der lokalen Zeitzone des Browsers anzeigen.
    if (!sqlDateTime) return '';
    const iso = sqlDateTime.replace(' ', 'T') + 'Z';
    const d = new Date(iso);
    if (isNaN(d)) return sqlDateTime;
    return d.toLocaleString('de-CH');
  }

  function render(tasks){
    listEl.innerHTML = '';
    if (!tasks.length){ listEl.innerHTML = '<p style="color:var(--muted)">Keine Tasks.</p>'; return; }
    for (const t of tasks){
      const div = document.createElement('div');
      div.className = 'card';
      const page = pageFromUrl(t.SourceUrl);
      div.innerHTML = `
        <div class="row1">
          <h3>${escapeHtml(t.Title)}</h3>
          <span>
            ${t.Target ? `<span class="badge target"><b>${TYPE_LABEL[t.TargetType] || 'App'}</b>${escapeHtml(t.Target)}</span>` : ''}
            <span class="badge ${t.Status}">${t.Status}</span>
          </span>
        </div>
        <div class="meta">${escapeHtml(t.SourceApp)}${page ? ' · ' + escapeHtml(page) : ''} · ${formatLocal(t.CreatedAt)}${t.SourceUrl ? ' · <a href="'+t.SourceUrl+'" target="_blank">Quelle</a>' : ''}</div>
        ${t.Note ? `<p class="note">${escapeHtml(t.Note)}</p>` : ''}
        <div class="actions">
          ${t.Status !== 'in_progress' ? `<button onclick="setStatus(${t.TaskID},'in_progress')">In Arbeit</button>` : ''}
          ${t.Status !== 'done' ? `<button onclick="setStatus(${t.TaskID},'done')">Erledigt</button>` : ''}
          ${t.Status !== 'open' ? `<button onclick="setStatus(${t.TaskID},'open')">Wieder öffnen</button>` : ''}
          <button onclick='openEdit(${JSON.stringify(t).replace(/'/g, "&#39;")})'>Bearbeiten</button>
          <button onclick="deleteTask(${t.TaskID})">Löschen</button>
        </div>`;
      listEl.appendChild(div);
    }
  }

  async function setStatus(id, status){
    await fetch(`${API_BASE}/tasks/${id}`, {
      method: 'PATCH', credentials: 'include',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ status })
    });
    loadTasks();
  }

  async function deleteTask(id){
    if (!confirm('Task wirklich löschen?')) return;
    await fetch(`${API_BASE}/tasks/${id}`, { method: 'DELETE', credentials: 'include' });
    loadTasks();
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const taskOverlay = document.getElementById('taskOverlay');
  const ntHeading = document.getElementById('nt-heading');
  let editingId = null; // null = neuer Task, sonst TaskID des zu bearbeitenden Tasks

  const ntTarget = document.getElementById('nt-target');
  const ntTargetList = document.getElementById('nt-target-list');
  const ntTargetLabel = document.getElementById('nt-target-label');
  const ntTypeRadios = [...document.querySelectorAll('input[name="nt-type"]')];
  const getNtType = () => (ntTypeRadios.find(r => r.checked) || {}).value || 'app';

  // Vorschlagsliste und Beschriftung abhängig von App/DB
  function applyNtType(type, keepValue){
    ntTypeRadios.forEach(r => { r.checked = r.value === type; });
    ntTargetLabel.textContent = type === 'db' ? 'Datenbank' : 'App';
    ntTarget.placeholder = type === 'db' ? 'z.B. db_admin' : 'z.B. energy';
    const names = type === 'db' ? targets.dbs : targets.apps;
    ntTargetList.innerHTML = names.map(n => `<option value="${escapeHtml(n)}"></option>`).join('');
    if (!keepValue) ntTarget.value = '';
  }
  ntTypeRadios.forEach(r => r.onchange = () => applyNtType(getNtType(), false));

  document.getElementById('newTaskBtn').onclick = () => {
    editingId = null;
    ntHeading.textContent = 'Neuer Task';
    taskOverlay.style.display = 'flex';
    document.getElementById('nt-status').textContent = '';
    // Filter-Auswahl als Vorbelegung übernehmen
    const sel = filterTarget.value;
    if (sel) {
      const i = sel.indexOf(':');
      applyNtType(sel.slice(0, i), true);
      ntTarget.value = sel.slice(i + 1);
    } else {
      applyNtType(filterType.value || 'app', false);
    }
    document.getElementById('nt-title').value = '';
    document.getElementById('nt-note').value = '';
    document.getElementById('nt-prio').value = 'normal';
  };

  window.openEdit = function(t){
    editingId = t.TaskID;
    ntHeading.textContent = 'Task bearbeiten';
    taskOverlay.style.display = 'flex';
    document.getElementById('nt-status').textContent = '';
    applyNtType(t.TargetType || 'app', true);
    ntTarget.value = t.Target || t.SourceApp || '';
    document.getElementById('nt-title').value = t.Title;
    document.getElementById('nt-note').value = t.Note || '';
    document.getElementById('nt-prio').value = t.Priority || 'normal';
  };

  document.getElementById('nt-cancel').onclick = () => { taskOverlay.style.display = 'none'; };
  document.getElementById('nt-save').onclick = async () => {
    const title = document.getElementById('nt-title').value.trim();
    const note = document.getElementById('nt-note').value.trim();
    const priority = document.getElementById('nt-prio').value;
    const st = document.getElementById('nt-status');
    const targetType = getNtType();
    const target = ntTarget.value.trim();
    if (!target) { st.textContent = (targetType === 'db' ? 'Datenbank' : 'App') + ' ist Pflicht.'; return; }
    if (!title) { st.textContent = 'Titel ist Pflicht.'; return; }
    st.textContent = 'Speichere…';
    try {
      let res;
      if (editingId) {
        res = await fetch(`${API_BASE}/tasks/${editingId}`, {
          method: 'PATCH', credentials: 'include',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ title, note, priority, targetType, target })
        });
      } else {
        res = await fetch(`${API_BASE}/tasks`, {
          method: 'POST', credentials: 'include',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ sourceApp: 'db_admin', sourceUrl: window.location.href, title, note, priority, targetType, target })
        });
      }
      if (!res.ok) throw new Error('HTTP '+res.status);
      st.textContent = 'Gespeichert ✓';
      setTimeout(() => { taskOverlay.style.display = 'none'; loadTargets(); loadTasks(); }, 500);
    } catch(e) {
      st.innerHTML = 'Nicht eingeloggt oder Verbindung fehlgeschlagen. ' +
        '<a href="' + API_BASE + '/tasks" target="_blank" rel="noopener">Hier einloggen</a> und danach nochmal Speichern klicken.';
    }
  };

  document.getElementById('refreshBtn').onclick = loadTasks;
  filterStatus.onchange = loadTasks;
  filterType.onchange = () => { fillFilterTarget(); loadTasks(); };
  filterTarget.onchange = loadTasks;
  filterText.oninput = () => { clearTimeout(window._ft); window._ft = setTimeout(loadTasks, 300); };

  loadTargets();
  loadTasks();
</script>
  <script src="assets/improvements-button.js" data-app="db_admin"></script>
</body>
</html>
