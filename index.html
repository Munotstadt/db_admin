<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turso Usage Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E30613;
    --bg: #0f1115;
    --card: #171a21;
    --border: #262a33;
    --text: #e8e9ec;
    --muted: #8b909c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 20px 16px 60px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .db-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .db-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .db-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 16px;
  }
  .db-updated {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .metrics {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .metric {
    background: #11131a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .metric-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .metric-value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 500;
  }
  .metric-value.accent { color: var(--red); }
  .chart-block { margin-top: 10px; }
  .chart-title {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    font-family: 'IBM Plex Mono', monospace;
  }
  svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
  .line { fill: none; stroke: var(--red); stroke-width: 2; }
  .dot { fill: var(--red); }
  .dot-hit { fill: transparent; }
  .axis-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    fill: var(--muted);
  }
  .grid-line { stroke: var(--border); stroke-width: 1; }
  #tooltip {
    position: fixed;
    background: #000;
    border: 1px solid var(--red);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    pointer-events: none;
    display: none;
    z-index: 10;
    white-space: nowrap;
  }
  .empty-state {
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 40px 0;
    text-align: center;
  }
</style>
</head>
<body>

<h1>Turso Usage</h1>
<div class="subtitle" id="subtitle">lädt …</div>
<div id="content"></div>
<div id="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
const CSV_URL = "data/turso_usage.csv"; // ggf. relativen Pfad anpassen
const tooltip = document.getElementById("tooltip");

function fmtBytes(n) {
  n = Number(n);
  const units = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(i === 0 ? 0 : 2)} ${units[i]}`;
}

function fmtInt(n) {
  return Number(n).toLocaleString('de-CH');
}

function parseDatum(d) {
  // DD.MM.YYYY -> Date
  const [dd, mm, yyyy] = d.split('.').map(Number);
  return new Date(Date.UTC(yyyy, mm - 1, dd));
}

function buildSparkline(rows, key, formatter, id) {
  const w = 600, h = 90, padL = 4, padR = 4, padT = 10, padB = 18;
  const values = rows.map(r => Number(r[key]));
  const max = Math.max(...values, 1);
  const min = 0;
  const stepX = (w - padL - padR) / Math.max(values.length - 1, 1);

  const points = values.map((v, i) => {
    const x = padL + i * stepX;
    const y = padT + (1 - (v - min) / (max - min || 1)) * (h - padT - padB);
    return { x, y, v, datum: rows[i]['Datum'] };
  });

  const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  let dots = '';
  points.forEach((p, i) => {
    dots += `<circle class="dot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5"></circle>`;
    dots += `<circle class="dot-hit" data-idx="${i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="12"></circle>`;
  });

  const firstLabel = points[0] ? points[0].datum : '';
  const lastLabel = points[points.length - 1] ? points[points.length - 1].datum : '';

  const svg = `
    <svg viewBox="0 0 ${w} ${h}" id="${id}" data-key="${key}">
      <line class="grid-line" x1="${padL}" y1="${h - padB}" x2="${w - padR}" y2="${h - padB}"></line>
      <path class="line" d="${pathD}"></path>
      ${dots}
      <text class="axis-label" x="${padL}" y="${h - 4}">${firstLabel}</text>
      <text class="axis-label" x="${w - padR}" y="${h - 4}" text-anchor="end">${lastLabel}</text>
    </svg>`;

  return { svg, points, formatter };
}

function attachTooltip(containerId, points, formatter, label) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.querySelectorAll('.dot-hit').forEach(hit => {
    const idx = Number(hit.dataset.idx);
    const p = points[idx];
    const show = (clientX, clientY) => {
      tooltip.style.display = 'block';
      tooltip.style.left = (clientX + 12) + 'px';
      tooltip.style.top = (clientY - 30) + 'px';
      tooltip.innerHTML = `${p.datum}<br>${label}: <b>${formatter(p.v)}</b>`;
    };
    hit.addEventListener('mousemove', e => show(e.clientX, e.clientY));
    hit.addEventListener('mouseleave', () => tooltip.style.display = 'none');
    hit.addEventListener('touchstart', e => {
      const t = e.touches[0];
      show(t.clientX, t.clientY);
    }, { passive: true });
  });
  el.addEventListener('touchend', () => {
    setTimeout(() => tooltip.style.display = 'none', 1500);
  });
}

function render(rowsByDb) {
  const content = document.getElementById('content');
  content.innerHTML = '';

  const dbNames = Object.keys(rowsByDb).sort();
  dbNames.forEach((dbName, dbIdx) => {
    const rows = rowsByDb[dbName].sort((a, b) => parseDatum(a.Datum) - parseDatum(b.Datum));
    const latest = rows[rows.length - 1];

    const card = document.createElement('div');
    card.className = 'db-card';

    card.innerHTML = `
      <div class="db-header">
        <div class="db-name">${dbName}</div>
        <div class="db-updated">Stand: ${latest.Datum}</div>
      </div>
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Rows Read</div>
          <div class="metric-value accent">${fmtInt(latest.RowsRead)}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Rows Written</div>
          <div class="metric-value accent">${fmtInt(latest.RowsWritten)}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Bytes Synced</div>
          <div class="metric-value">${fmtBytes(latest.BytesSynced)}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Storage</div>
          <div class="metric-value">${fmtBytes(latest.StorageBytes)}</div>
        </div>
      </div>
    `;

    const charts = [
      { key: 'RowsRead', label: 'Rows Read', formatter: fmtInt, title: 'Rows Read / Tag' },
      { key: 'RowsWritten', label: 'Rows Written', formatter: fmtInt, title: 'Rows Written / Tag' },
      { key: 'StorageBytes', label: 'Storage', formatter: fmtBytes, title: 'Storage-Verlauf' },
    ];

    charts.forEach((c, cIdx) => {
      if (rows.length < 2) return; // Sparkline braucht min. 2 Punkte
      const chartId = `chart-${dbIdx}-${cIdx}`;
      const { svg, points, formatter } = buildSparkline(rows, c.key, c.formatter, chartId);
      const block = document.createElement('div');
      block.className = 'chart-block';
      block.innerHTML = `<div class="chart-title">${c.title}</div>${svg}`;
      card.appendChild(block);
      setTimeout(() => attachTooltip(chartId, points, formatter, c.label), 0);
    });

    content.appendChild(card);
  });
}

Papa.parse(CSV_URL, {
  download: true,
  header: true,
  delimiter: ";",
  skipEmptyLines: true,
  complete: (results) => {
    const rows = results.data.filter(r => r.Datenbank);
    if (rows.length === 0) {
      document.getElementById('content').innerHTML = '<div class="empty-state">Noch keine Daten vorhanden.</div>';
      document.getElementById('subtitle').textContent = 'keine Daten';
      return;
    }
    const rowsByDb = {};
    rows.forEach(r => {
      if (!rowsByDb[r.Datenbank]) rowsByDb[r.Datenbank] = [];
      rowsByDb[r.Datenbank].push(r);
    });
    document.getElementById('subtitle').textContent =
      `${Object.keys(rowsByDb).length} Datenbank(en) · letztes Update ${rows[rows.length - 1].Datum}`;
    render(rowsByDb);
  },
  error: (err) => {
    document.getElementById('content').innerHTML =
      `<div class="empty-state">Fehler beim Laden der CSV: ${err.message}</div>`;
  }
});
</script>
</body>
</html>
