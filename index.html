<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Securities Data - Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF; --panel: #F7F8FA; --line: #E3E6EA; --text: #1A1D22;
    --muted: #767E8A; --accent: #E30613; --gain: #1F8A6E; --loss: #C0293D; --radius: 3px;
  }
  * { box-sizing: border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:48px 20px 80px; }
  .wrap{ width:100%; max-width:1100px; }
  .eyebrow{ display:flex; align-items:center; justify-content:space-between; padding-bottom:18px;
    border-bottom:2px solid var(--accent); margin-bottom:20px; }
  h1{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px; text-transform:uppercase; margin:0; }
  .sub{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); }
  .hidden{ display:none !important; }
  input, select, button{ font-family:'IBM Plex Mono',monospace; font-size:13px; }
  input, select{ padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius); background:var(--bg); color:var(--text); }
  button{ padding:8px 14px; border:1px solid var(--line); border-radius:var(--radius); background:none; color:var(--text); cursor:pointer; }
  button:hover{ border-color:var(--muted); }
  button.primary{ background:var(--text); color:var(--bg); border-color:var(--text); font-weight:600; }
  button.danger{ color:var(--loss); border-color:var(--loss); }

  #loginView{ max-width:360px; margin:80px auto 0; text-align:center; }
  #loginView input{ width:100%; margin:12px 0; }
  #loginError{ color:var(--loss); font-size:12px; min-height:16px; }

  .toolbar{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .toolbar select{ min-width:220px; }
  .status{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); margin-left:auto; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  thead th{ text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--muted); padding:8px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tbody td{ padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:hover{ background:var(--panel); }
  td input{ width:100%; min-width:80px; padding:4px 6px; font-size:12px; border:1px solid transparent; background:transparent; }
  td input:focus{ border-color:var(--accent); background:var(--bg); outline:none; }
  .row-actions{ display:flex; gap:6px; white-space:nowrap; }
  .row-actions button{ padding:4px 8px; font-size:11px; }

  .table-scroll{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); }

  .add-form{ margin-top:20px; padding:16px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); }
  .add-form h3{ font-family:'Space Grotesk',sans-serif; font-size:14px; margin:0 0 12px; }
  .add-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; margin-bottom:12px; }
  .add-grid label{ display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--muted); }

  .empty{ padding:40px; text-align:center; color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:13px; }
  .error{ color:var(--loss); }
</style>
</head>
<body>

<div id="loginView">
  <h1>Securities Admin</h1>
  <div class="sub">Passwort erforderlich</div>
  <input type="password" id="passwordInput" placeholder="Passwort">
  <button class="primary" id="loginBtn" style="width:100%">Anmelden</button>
  <div id="loginError"></div>
</div>

<div class="wrap hidden" id="appView">
  <div class="eyebrow">
    <div><h1>Securities Admin</h1><span class="sub">SecuritiesDBtwo</span></div>
    <button id="logoutBtn">Logout</button>
  </div>

  <div class="toolbar">
    <select id="tableSelect"><option value="">Tabelle wählen…</option></select>
    <button id="refreshBtn">Refresh</button>
    <span class="status" id="statusText"></span>
  </div>

  <div class="table-scroll">
    <table id="dataTable">
      <thead><tr id="tableHead"></tr></thead>
      <tbody id="tableBody"><tr><td class="empty">Wähle eine Tabelle.</td></tr></tbody>
    </table>
  </div>

  <div class="add-form hidden" id="addForm">
    <h3>Neue Zeile hinzufügen</h3>
    <div class="add-grid" id="addGrid"></div>
    <button class="primary" id="addSubmitBtn">Hinzufügen</button>
  </div>
</div>

<script>
  const API_BASE = "/api"; // Static Web Apps routet /api automatisch zur Function

  let currentTable = null;
  let currentColumns = [];
  let currentPk = null;
  let currentRows = [];

  function getPassword() { return sessionStorage.getItem('adminPassword') || ''; }

  async function apiFetch(path, options = {}) {
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: { 'Content-Type': 'application/json', 'x-admin-password': getPassword(), ...(options.headers || {}) }
    });
    if (res.status === 401) throw new Error('UNAUTHORIZED');
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || `HTTP ${res.status}`);
    }
    return res.json();
  }

  async function login() {
    const pwd = document.getElementById('passwordInput').value;
    sessionStorage.setItem('adminPassword', pwd);
    try {
      const tables = await apiFetch('/tables');
      showApp(tables);
    } catch (e) {
      document.getElementById('loginError').textContent = e.message === 'UNAUTHORIZED' ? 'Falsches Passwort.' : e.message;
      sessionStorage.removeItem('adminPassword');
    }
  }

  function showApp(tables) {
    document.getElementById('loginView').classList.add('hidden');
    document.getElementById('appView').classList.remove('hidden');
    const select = document.getElementById('tableSelect');
    select.innerHTML = '<option value="">Tabelle wählen…</option>' +
      tables.map(t => `<option value="${t}">${t}</option>`).join('');
  }

  function logout() {
    sessionStorage.removeItem('adminPassword');
    document.getElementById('appView').classList.add('hidden');
    document.getElementById('loginView').classList.remove('hidden');
    document.getElementById('passwordInput').value = '';
  }

  function fmtCellValue(v) {
    if (v === null || v === undefined) return '';
    return String(v);
  }

  async function loadTable(table) {
    currentTable = table;
    const statusText = document.getElementById('statusText');
    statusText.textContent = 'Lade…';
    try {
      const data = await apiFetch(`/tables/${encodeURIComponent(table)}`);
      currentColumns = data.columns;
      currentPk = data.primaryKey;
      currentRows = data.rows;
      renderTable();
      renderAddForm();
      statusText.textContent = `${currentRows.length} Zeile(n) · PK: ${currentPk}`;
    } catch (e) {
      statusText.textContent = '';
      document.getElementById('tableBody').innerHTML = `<tr><td class="error">${e.message}</td></tr>`;
    }
  }

  function renderTable() {
    const head = document.getElementById('tableHead');
    const body = document.getElementById('tableBody');

    head.innerHTML = currentColumns.map(c => `<th>${c.name}</th>`).join('') + '<th>Aktionen</th>';

    if (currentRows.length === 0) {
      body.innerHTML = `<tr><td colspan="${currentColumns.length + 1}" class="empty">Keine Zeilen.</td></tr>`;
      return;
    }

    body.innerHTML = currentRows.map((row, idx) => {
      const cells = currentColumns.map(c => {
        const isPk = c.name === currentPk;
        const val = fmtCellValue(row[c.name]);
        return `<td><input type="text" data-col="${c.name}" data-row="${idx}" value="${val.replace(/"/g, '&quot;')}" ${isPk ? 'disabled' : ''}></td>`;
      }).join('');
      return `<tr>${cells}<td class="row-actions">
        <button onclick="saveRow(${idx})">Speichern</button>
        <button class="danger" onclick="deleteRow(${idx})">Löschen</button>
      </td></tr>`;
    }).join('');
  }

  function renderAddForm() {
    const addForm = document.getElementById('addForm');
    const grid = document.getElementById('addGrid');
    addForm.classList.remove('hidden');
    grid.innerHTML = currentColumns.map(c => `
      <label>${c.name}${c.nullable ? '' : ' *'}
        <input type="text" data-newcol="${c.name}" placeholder="${c.type}">
      </label>`).join('');
  }

  async function saveRow(idx) {
    const inputs = document.querySelectorAll(`input[data-row="${idx}"]`);
    const updates = {};
    inputs.forEach(inp => {
      const col = inp.dataset.col;
      if (col === currentPk) return;
      updates[col] = inp.value === '' ? null : inp.value;
    });
    const pkValue = currentRows[idx][currentPk];
    try {
      await apiFetch(`/tables/${encodeURIComponent(currentTable)}`, {
        method: 'PUT',
        body: JSON.stringify({ pkColumn: currentPk, pkValue, updates })
      });
      document.getElementById('statusText').textContent = 'Gespeichert.';
      loadTable(currentTable);
    } catch (e) {
      alert('Fehler beim Speichern: ' + e.message);
    }
  }

  async function deleteRow(idx) {
    const pkValue = currentRows[idx][currentPk];
    if (!confirm(`Zeile mit ${currentPk} = ${pkValue} wirklich löschen?`)) return;
    try {
      await apiFetch(`/tables/${encodeURIComponent(currentTable)}`, {
        method: 'DELETE',
        body: JSON.stringify({ pkColumn: currentPk, pkValue })
      });
      loadTable(currentTable);
    } catch (e) {
      alert('Fehler beim Löschen: ' + e.message);
    }
  }

  async function addRow() {
    const inputs = document.querySelectorAll('input[data-newcol]');
    const body = {};
    inputs.forEach(inp => {
      const col = inp.dataset.newcol;
      if (inp.value !== '') body[col] = inp.value;
    });
    try {
      await apiFetch(`/tables/${encodeURIComponent(currentTable)}`, {
        method: 'POST',
        body: JSON.stringify(body)
      });
      inputs.forEach(inp => inp.value = '');
      loadTable(currentTable);
    } catch (e) {
      alert('Fehler beim Hinzufügen: ' + e.message);
    }
  }

  document.getElementById('loginBtn').addEventListener('click', login);
  document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('tableSelect').addEventListener('change', e => { if (e.target.value) loadTable(e.target.value); });
  document.getElementById('refreshBtn').addEventListener('click', () => { if (currentTable) loadTable(currentTable); });
  document.getElementById('addSubmitBtn').addEventListener('click', addRow);

  // Auto-Login, falls Passwort noch in dieser Session gespeichert ist
  if (getPassword()) {
    apiFetch('/tables').then(showApp).catch(() => sessionStorage.removeItem('adminPassword'));
  }
</script>

</body>
</html>
