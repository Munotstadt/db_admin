name: Collect Turso Usage

on:
  schedule:
    # 03:00 UTC täglich -> deckt den vollen Vortag (00:00-00:00 UTC) ab
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Collect usage
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORG_SLUG: ${{ secrets.TURSO_ORG_SLUG }}
        run: python scripts/collect_turso_usage.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/turso_usage.csv
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git pull --rebase --autostash origin main
          git commit -m "Turso usage update $(date -u +'%d.%m.%Y')"
          git push
