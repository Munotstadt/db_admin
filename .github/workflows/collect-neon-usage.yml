name: Collect Neon Usage

on:
  schedule:
    - cron: "5 3 * * *"  # kurz nach dem Turso-Collector
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Collect usage
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
        run: python scripts/collect_neon_usage.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/neon_usage.csv
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git pull --rebase --autostash origin main
          git commit -m "Neon usage update $(date -u +'%d.%m.%Y')"
          git push
